appId: app.rbc.easy
productName: RBC EASY
directories:
  output: release
files:
  - dist/**
  - electron/**
  - package.json
asar: true
win:
  target:
    - nsis
    - portable
  artifactName: RBC-EASY-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: RBC EASY
linux:
  target:
    - AppImage
    - deb
  category: Utility
  synopsis: Calculadora, biblias y herramientas RBC
mac:
  target:
    - dmg
  category: public.app-category.utilities
