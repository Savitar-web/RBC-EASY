<!doctype html><meta charset="utf-8"><title>Validación WebP y respaldo</title><button id="test">Validar imágenes y respaldo seguro</button><pre id="result">Pendiente</pre><script type="module">
import {compressImage} from '/src/community/client.ts';import {isLocalDataKey,exportTransfer} from '/src/lib/transfer.ts';document.querySelector('#test').onclick=async()=>{try{const canvas=document.createElement('canvas');canvas.width=2400;canvas.height=1400;const ctx=canvas.getContext('2d');ctx.fillStyle='#ba3322';ctx.fillRect(0,0,2400,1400);const png=await new Promise(r=>canvas.toBlob(r,'image/png'));const blob=await compressImage(new File([png],'prueba.png',{type:'image/png'}));const bitmap=await createImageBitmap(blob);const backup=JSON.parse(await(await exportTransfer()).text());const excluded=['rbc-auth-session','sb-project-auth-token','password','access_token'].every(k=>!isLocalDataKey(k));document.querySelector('#result').textContent=JSON.stringify({webp:blob.type==='image/webp',width:bitmap.width,height:bitmap.height,bytes:blob.size,credentialsExcluded:excluded&&Object.keys(backup.local).every(isLocalDataKey)});}catch(e){document.querySelector('#result').textContent='ERROR '+e.message;}};
</script>
