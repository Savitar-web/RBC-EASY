<!doctype html><meta charset="utf-8"><title>Prueba de voz RBC</title><button id="test">Probar voz neural</button><pre id="result">Pendiente</pre><audio controls id="audio"></audio><script>
document.querySelector('#test').onclick=()=>{const result=document.querySelector('#result');result.textContent='Descargando y sintetizando…';const worker=new Worker('/tts/neural/worker.js');worker.onmessage=async({data})=>{if('progress'in data){result.textContent='Descarga '+data.progress+'%';return;}if(data.error){result.textContent='ERROR '+data.error;return;}const blob=new Blob([data.bytes],{type:'audio/mpeg'});document.querySelector('audio').src=URL.createObjectURL(blob);try{const ctx=new AudioContext(),decoded=await ctx.decodeAudioData(await blob.arrayBuffer());result.textContent=JSON.stringify({ok:true,bytes:blob.size,duration:decoded.duration,sampleRate:decoded.sampleRate,peak:Math.max(...decoded.getChannelData(0).slice(0,100000))});await ctx.close();}catch(e){result.textContent='DECODE ERROR '+e.message;}worker.terminate();};worker.onerror=e=>result.textContent='WORKER ERROR '+e.message;worker.postMessage({text:'Hola. Esta es una prueba de voz natural para compartir nuestras historias. La batalla apenas comienza.',voice:'es_ES-davefx-medium',speed:1});};
</script>
