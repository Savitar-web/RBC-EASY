<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Tema de la aplicación -->
    <meta name="theme-color" content="#ff0000" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/icons/pwa/favicon-16.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/pwa/favicon-32.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="/icons/pwa/favicon-48.png"
    />

    <!-- Apple / iOS -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/pwa/apple-touch-icon-180.png"
    />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Apariencia iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RBC-EASY" />

    <!-- Windows -->
    <meta name="msapplication-TileColor" content="#ff0000" />

    <title>RBC-EASY</title>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
