<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07070c" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="RBC EASY" />
    <meta name="description" content="RBC EASY: biblias, calculadora, balística y conversión. Se puede añadir al inicio y usar sin conexión." />
    <link id="app-manifest" rel="manifest" href="/manifest.webmanifest" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/pwa/icon-180x180.png" />
    <script>
      (() => {
        const params = new URLSearchParams(location.search);
        const routes = ['inicio','proyectos','biblias','writer','calcular','balistica','conversion','modo-ascendido','contacto','cuenta','explorar'];
        const key = params.has('web') ? (location.pathname.slice(1).toLowerCase() || 'inicio') : params.has('install') ? (location.pathname.slice(1).toLowerCase() || 'inicio') : params.get('app');
        if(params.has('web')){document.querySelector('meta[name="apple-mobile-web-app-capable"]').content='no';document.querySelector('meta[name="mobile-web-app-capable"]').content='no';}
        if (routes.includes(key)) {
          document.getElementById('app-manifest').href = '/shortcuts/' + (params.has('web')?'web-':'') + key + '.webmanifest';
          const names = {inicio:'RBC EASY', proyectos:'Proyectos', biblias:'Biblias Maker', writer:'Escritor', calcular:'Calculadora', balistica:'Balística', conversion:'Conversión', 'modo-ascendido':'Modo ascendido', contacto:'Contacto',cuenta:'Cuenta',explorar:'Explorar'};
          document.querySelector('meta[name="apple-mobile-web-app-title"]').content = names[key];
          document.querySelector('link[rel="apple-touch-icon"]')?.setAttribute('href', '/icons/pwa/icon-180x180.png');
        }
      })();
    </script>
    <title>RBC EASY</title>
  </head>
  <body>
    <div id="rbc-boot" role="status" style="position:fixed;inset:0;z-index:60001;display:grid;place-items:center;background:linear-gradient(#08080c99,#08080ccc),url('/images/backgrounds/FCC.png') center/cover;background-color:#07070c;color:white;font:16px system-ui">Preparando tu espacio…</div>
    <script>try{if(localStorage.getItem('rbc-install-complete')||sessionStorage.getItem('rbc-install-later'))document.getElementById('rbc-boot').remove();}catch{}</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
